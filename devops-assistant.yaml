---
apiVersion: v1
kind: Namespace
metadata:
  name: devops-assistant
  labels:
    name: devops-assistant

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-config
  namespace: devops-assistant
data:
  MONITORED_REPOS: "kubernetes/kubernetes, helm/helm"
  LOG_LEVEL: "info"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-analyzer
  namespace: devops-assistant
  labels:
    app: github-analyzer
spec:
  replicas: 2 # Ensures high availability ("frequently running")
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: github-analyzer
  template:
    metadata:
      labels:
        app: github-analyzer
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: analyzer-web
        image: willey2003/github-analyzer:latest # Replace with your built image
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
        envFrom:
        - configMapRef:
            name: assistant-config
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        # SELF-HEALING: Liveness Probe (restarts container if it deadlocks)
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 3
          failureThreshold: 3
        # SELF-HEALING: Readiness Probe (removes pod from Service if not ready)
        # NOTE: image is built manually and only serves /health; /ready needs an image rebuild
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL

---
apiVersion: v1
kind: Service
metadata:
  name: github-analyzer-svc
  namespace: devops-assistant
spec:
  type: ClusterIP # Use NodePort or LoadBalancer if external access is needed
  selector:
    app: github-analyzer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    name: http
