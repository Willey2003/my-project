---
apiVersion: v1
kind: Namespace
metadata:
  name: devops-assistant
  labels:
    name: devops-assistant

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: assistant-config
  namespace: devops-assistant
data:
  MONITORED_REPOS: "kubernetes/kubernetes, helm/helm"
  LOG_LEVEL: "info"
  GITHUB_TOKEN_SECRET: "github-token-secret"

---
apiVersion: v1
kind: Secret
metadata:
  name: github-token-secret
  namespace: devops-assistant
type: Opaque
stringData:
  # Base64 encoded placeholder - replace with actual token
  GITHUB_TOKEN: "your-github-token-here"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-analyzer
  namespace: devops-assistant
  labels:
    app: github-analyzer
    version: v2.0.0
spec:
  replicas: 3 # Increased for better high availability
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
  selector:
    matchLabels:
      app: github-analyzer
  template:
    metadata:
      labels:
        app: github-analyzer
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: github-analyzer-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: analyzer-web
        image: willey2003/github-analyzer:latest # Replace with your built image
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        env:
        - name: PORT
          value: "8080"
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: assistant-config
              key: LOG_LEVEL
        envFrom:
        - secretRef:
            name: github-token-secret
            optional: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "200m"
          limits:
            memory: "512Mi"
            cpu: "1000m"
        # SELF-HEALING: Liveness Probe (restarts container if it deadlocks)
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        # SELF-HEALING: Readiness Probe (removes pod from Service if not ready)
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        # Startup probe for slow-starting containers
        startupProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
          runAsNonRoot: true
        volumeMounts:
        - name: tmp-volume
          mountPath: /tmp
      volumes:
      - name: tmp-volume
        emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - github-analyzer
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: github-analyzer-svc
  namespace: devops-assistant
  labels:
    app: github-analyzer
spec:
  type: ClusterIP
  selector:
    app: github-analyzer
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    name: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-analyzer-ingress
  namespace: devops-assistant
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
  - hosts:
    - analyzer.example.com # Replace with your domain
    secretName: github-analyzer-tls
  rules:
  - host: analyzer.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: github-analyzer-svc
            port:
              number: 80

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-analyzer-sa
  namespace: devops-assistant
  labels:
    app: github-analyzer

---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: github-analyzer-pdb
  namespace: devops-assistant
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: github-analyzer

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: github-analyzer-hpa
  namespace: devops-assistant
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: github-analyzer
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
