# Week 21: copy lab/docker/app to <your-repo>/app and this file to <your-repo>/.github/workflows/.
name: ci
on:
  pull_request:
  workflow_call:   # release.yml reuses this on pushes to main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: app/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=junit-${{ matrix.python }}.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: junit-${{ matrix.python }}
          path: app/junit-${{ matrix.python }}.xml
