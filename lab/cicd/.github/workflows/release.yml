# Week 22: push to main -> test -> build image tagged with commit SHA -> scan -> push to GHCR -> deploy.
# Fails closed: any red step stops everything after it.
# Repo settings needed: Settings > Actions > Workflow permissions: read and write (for GHCR),
# and for the optional deploy job: an environment "production" with secrets DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/lab-api

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "image=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]'):${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build (load locally for scanning)
        uses: docker/build-push-action@v6
        with:
          context: app
          target: runtime
          load: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy gate (HIGH/CRITICAL fixable = fail)
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 "${{ steps.meta.outputs.image }}"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: docker push "${{ steps.meta.outputs.image }}"

  deploy:
    needs: build
    if: vars.ENABLE_DEPLOY == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy over SSH
        env:
          KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            "docker pull $IMAGE && (docker rm -f lab-api || true) && docker run -d --name lab-api -p 8000:8000 -e REQUIRE_DB=false $IMAGE"
          sleep 5
          ssh -i key "$USER@$HOST" "curl -fsS localhost:8000/healthz"
