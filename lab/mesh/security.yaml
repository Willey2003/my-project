# Securing workloads (25% of ICA): mesh-wide STRICT mTLS + zero-trust authorization.
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata: { name: default, namespace: istio-system }
spec:
  mtls: { mode: STRICT }
---
# Deny-all in mesh-bookinfo namespace, then allow only the paths bookinfo needs.
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: allow-nothing, namespace: mesh-bookinfo }
spec: {}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: productpage-from-gateway, namespace: mesh-bookinfo }
spec:
  selector: { matchLabels: { app: productpage } }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["cluster.local/ns/istio-system/sa/istio-ingressgateway-service-account"] } }]
      to: [{ operation: { methods: ["GET"] } }]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: reviews-details-from-productpage, namespace: mesh-bookinfo }
spec:
  selector: { matchExpressions: [{ key: app, operator: In, values: [reviews, details] }] }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["cluster.local/ns/mesh-bookinfo/sa/bookinfo-productpage"] } }]
      to: [{ operation: { methods: ["GET"] } }]
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata: { name: ratings-from-reviews, namespace: mesh-bookinfo }
spec:
  selector: { matchLabels: { app: ratings } }
  action: ALLOW
  rules:
    - from: [{ source: { principals: ["cluster.local/ns/mesh-bookinfo/sa/bookinfo-reviews"] } }]
---
# JWT: productpage additionally accepts requests only with a valid token from Istio's sample issuer.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata: { name: jwt-demo, namespace: istio-system }
spec:
  selector: { matchLabels: { istio: ingressgateway } }
  jwtRules:
    - issuer: "testing@secure.istio.io"
      jwksUri: "https://raw.githubusercontent.com/istio/istio/master/security/tools/jwt/samples/jwks.json"
