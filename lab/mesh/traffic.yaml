# Traffic management (35% of ICA): subsets, weighted split, header routing, fault injection, circuit breaking.
apiVersion: v1
kind: Namespace
metadata:
  name: mesh-bookinfo
  labels:
    lab.devops/component: ica
    istio-injection: enabled
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: { name: reviews, namespace: mesh-bookinfo }
spec:
  host: reviews
  trafficPolicy:
    connectionPool:
      tcp: { maxConnections: 10 }
      http: { http1MaxPendingRequests: 5, maxRequestsPerConnection: 1 }
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
  subsets:
    - { name: v1, labels: { version: v1 } }
    - { name: v2, labels: { version: v2 } }
    - { name: v3, labels: { version: v3 } }
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: reviews, namespace: mesh-bookinfo }
spec:
  hosts: [reviews]
  http:
    - match: [{ headers: { end-user: { exact: jason } } }]   # log in as 'jason' on productpage
      route: [{ destination: { host: reviews, subset: v3 } }]
    - route:
        - { destination: { host: reviews, subset: v1 }, weight: 80 }
        - { destination: { host: reviews, subset: v2 }, weight: 20 }
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata: { name: ratings, namespace: mesh-bookinfo }
spec:
  host: ratings
  subsets: [{ name: v1, labels: { version: v1 } }]
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata: { name: ratings, namespace: mesh-bookinfo }
spec:
  hosts: [ratings]
  http:
    - fault:
        delay: { percentage: { value: 50 }, fixedDelay: 3s }
      route: [{ destination: { host: ratings, subset: v1 } }]
      timeout: 10s
