<text x="40" y="50" font-size="20" font-weight="700" fill="#1F2937">GitOps with Argo on the kind cluster (lab/gitops)</text>
<text x="40" y="72" font-size="13" fill="#6B7280">./lab.sh addon argocd rollouts workflows; kubectl apply -n argocd -f root-app.yaml, then Argo CD syncs everything else from Git (auto prune + self-heal)</text>
