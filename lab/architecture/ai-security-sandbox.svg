<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="946" viewBox="0 0 1600 946" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>AI / LLM security sandbox (lab/ai-security)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="1600" height="946" fill="#FFFFFF"/>
<text x="40" y="50" font-size="20" font-weight="700" fill="#1F2937">AI / LLM security sandbox (lab/ai-security)</text>
<text x="40" y="72" font-size="13" fill="#6B7280">Compose project aisec: the model is pulled once over the egress network, then Ollama and the scanner run on an internal network with no internet and only mock tools</text>
<g id="group-internet"><rect x="670" y="104" width="890" height="170" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="682" y="124" font-size="14" font-weight="700" fill="#6B7280">Internet (only during the pull)</text></g>
