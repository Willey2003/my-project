<g id="node-ecs-pub"><polygon points="866.0,380.0 1034.0,380.0 1050.0,425.0 1034.0,470.0 866.0,470.0 850.0,425.0" fill="#FFFFFF" stroke="#4A78A8" stroke-width="1.4"/><text x="950.0" y="405.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">ECS Fargate</text><text x="950.0" y="422.5" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">service x2</text><text x="950.0" y="438.5" text-anchor="middle" font-size="12" fill="#6B7280">default: public IP,</text><text x="950.0" y="453.5" text-anchor="middle" font-size="12" fill="#6B7280">sg tasks &lt;- ALB only</text></g>
