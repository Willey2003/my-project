<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="976" viewBox="0 0 1600 976" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>AWS lab: ECS Fargate behind an ALB (lab/aws/terraform)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="1600" height="976" fill="#FFFFFF"/>
<text x="40" y="50" font-size="20" font-weight="700" fill="#1F2937">AWS lab: ECS Fargate behind an ALB (lab/aws/terraform)</text>
<text x="40" y="72" font-size="13" fill="#6B7280">terraform apply in ap-south-1 (costs money; destroy after every session). private_tasks = true moves the tasks to private subnets behind one NAT gateway</text>
<g id="group-ext"><rect x="40" y="104" width="740" height="150" rx="8" fill="#F3F4F6" stroke="#6B7280" stroke-width="1.3"/><text x="52" y="124" font-size="14" font-weight="700" fill="#6B7280">Outside AWS</text></g>
<g id="group-iam"><rect x="820" y="104" width="740" height="150" rx="8" fill="#FBEEEE" stroke="#A65656" stroke-width="1.3"/><text x="832" y="124" font-size="14" font-weight="700" fill="#A65656">IAM (ecs.tf, github_oidc.tf)</text></g>
<g id="group-vpc"><rect x="40" y="294" width="1520" height="400" rx="8" fill="#EAF1FA" stroke="#4A78A8" stroke-width="1.3"/><text x="52" y="314" font-size="14" font-weight="700" fill="#4A78A8">VPC 10.20.0.0/16 across 2 AZs (network.tf, ecs.tf)</text></g>
<g id="group-ops"><rect x="40" y="734" width="1520" height="150" rx="8" fill="#E8F5F4" stroke="#3B8683" stroke-width="1.3"/><text x="52" y="754" font-size="14" font-weight="700" fill="#3B8683">Monitoring and cost guard-rails (monitoring.tf)</text></g>
<g id="group-public"><rect x="60" y="334" width="1480" height="150" rx="8" fill="#EAF1FA" stroke="#4A78A8" stroke-width="1.3"/><text x="72" y="354" font-size="14" font-weight="700" fill="#4A78A8">Public subnets x2: 10.20.0.0/24, 10.20.1.0/24, default route -&gt; IGW</text></g>
<g id="group-private"><rect x="60" y="524" width="1480" height="150" rx="8" fill="#EDF5EC" stroke="#5B8C5A" stroke-width="1.3"/><text x="72" y="544" font-size="14" font-weight="700" fill="#5B8C5A">Private subnets x2: 10.20.10.0/24, 10.20.11.0/24, default route -&gt; NAT (if private_tasks)</text></g>
