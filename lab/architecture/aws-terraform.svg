<g id="node-gha"><path d="M488.0,214.8 C456.0,214.8 456.0,186.0 488.0,184.2 C488.0,159.0 532.0,151.8 552.0,162.6 C564.0,146.4 616.0,148.2 620.0,169.8 C664.0,168.0 664.0,205.8 632.0,209.4 C644.0,232.8 592.0,243.6 572.0,227.4 C552.0,243.6 496.0,240.0 488.0,214.8 Z" fill="#FFFFFF" stroke="#6B7280" stroke-width="1.4"/><text x="560.0" y="184.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">GitHub Actions</text><text x="560.0" y="200.0" text-anchor="middle" font-size="12" fill="#6B7280">OIDC token, repo</text><text x="560.0" y="215.0" text-anchor="middle" font-size="12" fill="#6B7280">main only</text></g>
