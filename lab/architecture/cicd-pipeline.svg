<g id="group-release"><rect x="40" y="434" width="1520" height="130" rx="8" fill="#F2EFF8" stroke="#7661A3" stroke-width="1.3"/><text x="52" y="454" font-size="14" font-weight="700" fill="#7661A3">release.yml (push to main, workflow_dispatch)</text></g>
<g id="group-targets"><rect x="970" y="604" width="590" height="150" rx="8" fill="#EDF5EC" stroke="#5B8C5A" stroke-width="1.3"/><text x="982" y="624" font-size="14" font-weight="700" fill="#5B8C5A">Registry and deploy target</text></g>
<g id="group-aws"><rect x="40" y="604" width="890" height="150" rx="8" fill="#FBEEEE" stroke="#A65656" stroke-width="1.3"/><text x="52" y="624" font-size="14" font-weight="700" fill="#A65656">AWS (lab/aws/terraform github_oidc.tf)</text></g>
