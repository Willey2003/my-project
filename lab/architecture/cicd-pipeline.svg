<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="846" viewBox="0 0 1600 846" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>CI/CD pipeline for lab-api (lab/cicd)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="1600" height="846" fill="#FFFFFF"/>
<text x="40" y="50" font-size="20" font-weight="700" fill="#1F2937">CI/CD pipeline for lab-api (lab/cicd)</text>
<text x="40" y="72" font-size="13" fill="#6B7280">Pull requests run ci.yml; pushes to main run release.yml (reuses ci.yml), which fails closed at every step; aws-oidc-example.yml proves keyless AWS access</text>
<g id="group-repo"><rect x="40" y="104" width="360" height="290" rx="8" fill="#F7F6F2" stroke="#7C7466" stroke-width="1.3"/><text x="52" y="124" font-size="14" font-weight="700" fill="#7C7466">GitHub repo lab-api</text></g>
