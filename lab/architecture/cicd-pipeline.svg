<g id="node-r-deploy"><rect x="1160" y="480" width="200" height="70" rx="6" fill="#FFFFFF" stroke="#7661A3" stroke-width="1.4"/><text x="1260.0" y="504.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1F2937">job deploy</text><text x="1260.0" y="520.0" text-anchor="middle" font-size="12" fill="#6B7280">if ENABLE_DEPLOY, env</text><text x="1260.0" y="535.0" text-anchor="middle" font-size="12" fill="#6B7280">production</text></g>
