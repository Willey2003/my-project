<g id="group-back"><rect x="820" y="314" width="720" height="130" rx="8" fill="#FBF4E6" stroke="#A8843A" stroke-width="1.3"/><text x="832" y="334" font-size="14" font-weight="700" fill="#A8843A">network back (internal: true, no internet)</text></g>
