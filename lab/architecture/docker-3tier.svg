<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="716" viewBox="0 0 1600 716" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>Docker Compose 3-tier stack (lab3tier)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="1600" height="716" fill="#FFFFFF"/>
<text x="40" y="50" font-size="20" font-weight="700" fill="#1F2937">Docker Compose 3-tier stack (lab3tier)</text>
<text x="40" y="72" font-size="13" fill="#6B7280">./lab.sh compose up builds lab-api from a multi-stage Dockerfile and starts web, api and db; ./lab.sh compose scan runs Trivy</text>
<g id="group-host"><rect x="40" y="104" width="260" height="130" rx="8" fill="#F7F6F2" stroke="#7C7466" stroke-width="1.3"/><text x="52" y="124" font-size="14" font-weight="700" fill="#7C7466">Host workstation</text></g>
<g id="group-build"><rect x="340" y="104" width="1220" height="130" rx="8" fill="#F2EFF8" stroke="#7661A3" stroke-width="1.3"/><text x="352" y="124" font-size="14" font-weight="700" fill="#7661A3">app/Dockerfile: multi-stage build (python 3.12-slim)</text></g>
<g id="group-compose"><rect x="40" y="274" width="1520" height="190" rx="8" fill="#EDF5EC" stroke="#5B8C5A" stroke-width="1.3"/><text x="52" y="294" font-size="14" font-weight="700" fill="#5B8C5A">Compose project lab3tier (./lab.sh compose up | down)</text></g>
<g id="group-trivy"><rect x="40" y="504" width="1520" height="120" rx="8" fill="#FBEEEE" stroke="#A65656" stroke-width="1.3"/><text x="52" y="524" font-size="14" font-weight="700" fill="#A65656">scan.sh: Trivy (./lab.sh compose scan), fails on fixable HIGH / CRITICAL</text></g>
