<text x="40" y="50" font-size="20" font-weight="700" fill="#1F2937">Istio service mesh: bookinfo (lab/mesh)</text>
<text x="40" y="72" font-size="13" fill="#6B7280">./lab.sh kind up mesh installs Istio (demo profile, or ISTIO_PROFILE=ambient); traffic.yaml routes and breaks bookinfo, security.yaml enforces STRICT mTLS and deny-by-default</text>
