<text x="40" y="50" font-size="20" font-weight="700" fill="#1F2937">Golden LFCS: two Ubuntu 24.04 VMs (Vagrant, bento/ubuntu-24.04)</text>
<text x="40" y="72" font-size="13" fill="#6B7280">cd lab/golden/lfcs &amp;&amp; VAGRANT_EXPERIMENTAL=disks vagrant up; 30 tasks in tasks.md (tN = task N), sudo /lfcs/check.sh grades the 14 [auto] ones</text>
