<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1086" viewBox="0 0 1600 1086" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title>OpenShift Local labs (lab/openshift)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4B5563"/></marker></defs>
<rect x="0" y="0" width="1600" height="1086" fill="#FFFFFF"/>
<text x="40" y="50" font-size="20" font-weight="700" fill="#1F2937">OpenShift Local labs (lab/openshift)</text>
<text x="40" y="72" font-size="13" fill="#6B7280">./crc.sh setup | start builds a single-node CRC cluster (6 vCPU, 16 GiB, 60 GiB, monitoring on); htpasswd-rbac.sh and quotas-scc.yaml shape it for EX280 / EX380 / EX430 drills</text>
<g id="group-host"><rect x="40" y="104" width="520" height="330" rx="8" fill="#F7F6F2" stroke="#7C7466" stroke-width="1.3"/><text x="52" y="124" font-size="14" font-weight="700" fill="#7C7466">Host workstation (KVM / Hyper-V / HVF)</text></g>
