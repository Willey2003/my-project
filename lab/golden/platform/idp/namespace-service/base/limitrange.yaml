apiVersion: v1
kind: LimitRange
metadata:
  name: tenant-defaults
spec:
  limits:
    - type: Container
      defaultRequest: { cpu: 100m, memory: 128Mi }   # injected when a container sets no requests
      default: { cpu: 500m, memory: 512Mi }          # injected when a container sets no limits
      max: { cpu: "2", memory: 2Gi }
      min: { cpu: 10m, memory: 16Mi }
    - type: PersistentVolumeClaim
      max: { storage: 10Gi }
