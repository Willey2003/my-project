# L7 HTTP: empire ships may only POST /v1/request-landing. Anything else on port 80 gets
# "Access denied" (HTTP 403) from the node's Envoy, e.g. PUT /v1/exhaust-port. xwing is still dropped at L3.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rule1
  namespace: cilium-lab
  labels: { lab.devops/component: cca }
spec:
  description: "L7 policy: restrict empire ships to POST /v1/request-landing"
  endpointSelector:
    matchLabels: { org: empire, class: deathstar }
  ingress:
    - fromEndpoints:
        - matchLabels: { org: empire }
      toPorts:
        - ports:
            - { port: "80", protocol: TCP }
          rules:
            http:
              - method: POST
                path: "/v1/request-landing"
