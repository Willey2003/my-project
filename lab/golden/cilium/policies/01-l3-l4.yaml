# L3/L4: only empire ships may reach the deathstar, and only on TCP/80.
# xwing (org=alliance) is dropped silently -> curl times out.
# Same name (rule1) as 02-l7-http.yaml on purpose: applying the L7 file REPLACES this one.
# Under different names their allows would be unioned, and the L7 filter would have no effect.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: rule1
  namespace: cilium-lab
  labels: { lab.devops/component: cca }
spec:
  description: "L3-L4 policy: restrict deathstar access to empire ships only"
  endpointSelector:
    matchLabels: { org: empire, class: deathstar }
  ingress:
    - fromEndpoints:
        - matchLabels: { org: empire }
      toPorts:
        - ports:
            - { port: "80", protocol: TCP }
