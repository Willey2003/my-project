# AlertmanagerConfig: namespaced routing merged into the kube-prometheus-stack Alertmanager.
# The operator automatically adds a namespace="prom-lab" matcher to this route, so only alerts
# carrying that label reach it (the rules keep `namespace` in every aggregation for this reason).
# up.sh makes sure the Alertmanager CR selects AlertmanagerConfigs in all namespaces.
# Notifications land in the alert-sink echo server:  kubectl -n prom-lab logs deploy/alert-sink -f
apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: shop-api
  namespace: prom-lab
  labels: { app: shop-api, release: kps }
spec:
  route:
    receiver: shop-warning
    groupBy: [alertname, job]
    groupWait: 30s
    groupInterval: 5m
    repeatInterval: 4h
    routes:
      - receiver: shop-critical
        matchers: [{ name: severity, value: critical, matchType: "=" }]
        groupWait: 10s
        repeatInterval: 1h
  receivers:
    - name: shop-warning
      webhookConfigs:
        - url: http://alert-sink.prom-lab.svc:8080/warning
          sendResolved: true
    - name: shop-critical
      webhookConfigs:
        - url: http://alert-sink.prom-lab.svc:8080/critical
          sendResolved: true
  inhibitRules:
    - sourceMatch: [{ name: severity, value: critical, matchType: "=" }]
      targetMatch: [{ name: severity, value: warning, matchType: "=" }]
      equal: [job]
---
# alert-sink: echoes every webhook body to stdout so you can read Alertmanager's JSON payload.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-sink
  namespace: prom-lab
  labels: { app: alert-sink }
spec:
  replicas: 1
  selector:
    matchLabels: { app: alert-sink }
  template:
    metadata:
      labels: { app: alert-sink }
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:35
          env:
            - { name: HTTP_PORT, value: "8080" }
            - { name: LOG_IGNORE_PATH, value: /healthz }
          ports:
            - { name: http, containerPort: 8080 }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 100m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: alert-sink
  namespace: prom-lab
spec:
  selector: { app: alert-sink }
  ports:
    - { name: http, port: 8080, targetPort: http }
