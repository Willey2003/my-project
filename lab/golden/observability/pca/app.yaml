# shop-api: Python app instrumented with prometheus_client (source: app.py, mounted from a ConfigMap
# generated by kustomization.yaml, so no image build is needed). 2 replicas so aggregation matters.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop-api
  namespace: prom-lab
  labels: { app: shop-api }
spec:
  replicas: 2
  selector:
    matchLabels: { app: shop-api }
  template:
    metadata:
      labels: { app: shop-api }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: shop-api
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - pip install --no-cache-dir --quiet --target /tmp/deps prometheus-client==0.21.1 && exec python /app/app.py
          env:
            - { name: PYTHONPATH, value: /tmp/deps }
            - { name: HOME, value: /tmp }
            - { name: ERROR_RATE, value: "0.02" }
            - { name: TRAFFIC_RPS, value: "5" }
            - { name: APP_VERSION, value: "1.0.0" }
          ports:
            - { name: http-metrics, containerPort: 8000 }
          readinessProbe:
            httpGet: { path: /healthz, port: http-metrics }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: code, mountPath: /app }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: code
          configMap: { name: shop-api-code }
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: shop-api
  namespace: prom-lab
  labels: { app: shop-api }
spec:
  selector: { app: shop-api }
  ports:
    - { name: http-metrics, port: 8000, targetPort: http-metrics }
