# OpenTelemetry Collector configuration (contrib distribution). Mounted from a ConfigMap generated by
# kustomization.yaml, so editing this file + `kubectl apply -k` rolls the Collector.
# Validate locally:
#   docker run --rm -v "$PWD":/c otel/opentelemetry-collector-contrib:0.135.0 validate --config=/c/collector-config.yaml
# OTLP in -> debug (stdout) + Jaeger (traces over OTLP) + Prometheus exporter (metrics on :8889).
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }      # default bind is localhost since v0.104 - be explicit in pods
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:                           # always first
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  resource:
    attributes:
      - { key: deployment.environment.name, value: lab, action: upsert }
      - { key: k8s.cluster.name, value: kind-lab, action: insert }
  # lab 5: uncomment, and add filter/health to the traces pipeline
  # filter/health:
  #   error_mode: ignore
  #   traces:
  #     span: ['attributes["url.path"] == "/healthz" or attributes["http.target"] == "/healthz"']
  batch:                                    # always last before exporters
    send_batch_size: 512
    timeout: 5s

exporters:
  debug:
    verbosity: detailed
    sampling_initial: 5                     # print the first 5 items per second, then 1 in 200
    sampling_thereafter: 200
  otlp/jaeger:
    endpoint: jaeger.otel-lab.svc:4317
    tls: { insecure: true }
    sending_queue: { enabled: true, queue_size: 1000 }
    retry_on_failure: { enabled: true, max_elapsed_time: 120s }
  prometheus:
    endpoint: 0.0.0.0:8889                  # scraped by the kps Prometheus via collector.yaml ServiceMonitor
    namespace: ""
    send_timestamps: false
    enable_open_metrics: true               # exemplars (trace_id) on histogram buckets
    resource_to_telemetry_conversion: { enabled: false }   # resource attrs go to target_info instead

extensions:
  health_check: { endpoint: 0.0.0.0:13133 }
  zpages: { endpoint: 0.0.0.0:55679 }       # /debug/pipelinez, /debug/tracez

service:
  extensions: [health_check, zpages]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [otlp/jaeger, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [prometheus, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, resource, batch]
      exporters: [debug]                    # no log backend in this lab - read them in the Collector logs
  telemetry:
    logs: { level: info }
    metrics:
      level: detailed
      readers:                              # Collector self-metrics (otelcol_*) on :8888
        - pull:
            exporter:
              prometheus: { host: 0.0.0.0, port: 8888 }
