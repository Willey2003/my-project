# otel-demo Flask app (image built from ./Dockerfile by ../../up.sh otel) + a load generator.
# All SDK configuration is via OTEL_* env vars read by opentelemetry-instrument.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-demo
  namespace: otel-lab
  labels: { app: otel-demo }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-demo }
  template:
    metadata:
      labels: { app: otel-demo }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: app
          image: localhost:5001/otel-demo:0.1
          ports:
            - { name: http, containerPort: 5000 }
          env:
            - name: POD_NAME
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: OTEL_SERVICE_NAME, value: otel-demo }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "service.version=0.1,service.namespace=shop,k8s.namespace.name=otel-lab,k8s.pod.name=$(POD_NAME)" }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://otel-collector.otel-lab.svc:4317" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: grpc }
            - { name: OTEL_TRACES_EXPORTER, value: otlp }
            - { name: OTEL_METRICS_EXPORTER, value: otlp }
            - { name: OTEL_LOGS_EXPORTER, value: otlp }
            - { name: OTEL_PYTHON_LOGGING_AUTO_INSTRUMENTATION_ENABLED, value: "true" }
            - { name: OTEL_METRIC_EXPORT_INTERVAL, value: "15000" }
            - { name: OTEL_PROPAGATORS, value: "tracecontext,baggage" }
            - { name: OTEL_TRACES_SAMPLER, value: parentbased_always_on }   # lab 6: parentbased_traceidratio + ARG
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 5
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { cpu: 500m, memory: 256Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-demo
  namespace: otel-lab
  labels: { app: otel-demo }
spec:
  selector: { app: otel-demo }
  ports:
    - { name: http, port: 5000, targetPort: http }
---
# Load generator: calls the app every second; sends W3C baggage so /inventory spans get app.tenant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-loadgen
  namespace: otel-lab
  labels: { app: otel-loadgen }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-loadgen }
  template:
    metadata:
      labels: { app: otel-loadgen }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 100, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: curl
          image: curlimages/curl:8.16.0
          command: ["sh", "-c"]
          args:
            - |
              i=0
              while true; do
                i=$((i+1))
                for p in / /rolldice /checkout /healthz; do
                  curl -s -o /dev/null -H "baggage: tenant=acme" "http://otel-demo:5000$p"
                done
                [ $((i % 20)) -eq 0 ] && curl -s -o /dev/null "http://otel-demo:5000/checkout?fail=1"
                sleep 1
              done
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
