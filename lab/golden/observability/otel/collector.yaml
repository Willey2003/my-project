# OpenTelemetry Collector as a gateway Deployment (plain manifests, no Operator needed).
# Config: collector-config.yaml -> ConfigMap otel-collector-config (kustomize configMapGenerator).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: otel-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: otel-lab
  labels: { app: otel-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      serviceAccountName: otel-collector
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.135.0
          args: ["--config=/conf/collector-config.yaml"]
          ports:
            - { name: otlp-grpc, containerPort: 4317 }
            - { name: otlp-http, containerPort: 4318 }
            - { name: prom-exporter, containerPort: 8889 }
            - { name: metrics, containerPort: 8888 }
            - { name: health, containerPort: 13133 }
            - { name: zpages, containerPort: 55679 }
          readinessProbe:
            httpGet: { path: /, port: health }
          livenessProbe:
            httpGet: { path: /, port: health }
            initialDelaySeconds: 10
          env:
            - name: GOMEMLIMIT
              value: 400MiB
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: config, mountPath: /conf }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: otel-lab
  labels: { app: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: otlp-grpc, appProtocol: grpc }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
    - { name: prom-exporter, port: 8889, targetPort: prom-exporter }
    - { name: metrics, port: 8888, targetPort: metrics }
    - { name: zpages, port: 55679, targetPort: zpages }
---
# Let the kube-prometheus-stack Prometheus (selects release: kps) scrape app metrics exported by the
# Collector (:8889) and the Collector's own metrics (:8888).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: otel-collector
  namespace: otel-lab
  labels: { app: otel-collector, release: kps }
spec:
  selector:
    matchLabels: { app: otel-collector }
  namespaceSelector:
    matchNames: [otel-lab]
  endpoints:
    - port: prom-exporter
      interval: 15s
      honorLabels: true      # keep job/instance derived from service.name / service.instance.id
    - port: metrics
      interval: 30s
