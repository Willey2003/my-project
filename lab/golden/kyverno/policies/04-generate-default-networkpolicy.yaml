# generate: every namespace labelled lab.devops/component=kca gets a default-deny-ingress NetworkPolicy.
# synchronize: true -> Kyverno recreates it if deleted and reverts manual edits.
# generateExisting: true -> also for matching namespaces that existed before the policy
#   (rule-level field since Kyverno 1.13; older policies set spec.generateExisting).
# The background controller creates the NetworkPolicy, so it needs RBAC for that kind (ClusterRoles below,
# picked up through Kyverno's aggregated ClusterRoles).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-lab:background-networkpolicies
  labels:
    rbac.kyverno.io/aggregate-to-background-controller: "true"
    lab.devops/component: kca
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno-lab:admission-networkpolicies-view
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    lab.devops/component: kca
rules:
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, list, watch]
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: generate-default-networkpolicy
  annotations:
    policies.kyverno.io/title: Generate Default NetworkPolicy
    policies.kyverno.io/category: Multi-Tenancy
    policies.kyverno.io/severity: medium
    policies.kyverno.io/description: New lab namespaces get a default-deny-ingress NetworkPolicy.
spec:
  rules:
    - name: default-deny-ingress
      match:
        any:
          - resources:
              kinds: [Namespace]
              selector:
                matchLabels:
                  lab.devops/component: kca
      generate:
        apiVersion: networking.k8s.io/v1
        kind: NetworkPolicy
        name: default-deny-ingress
        namespace: "{{request.object.metadata.name}}"
        synchronize: true
        generateExisting: true
        data:
          metadata:
            labels:
              lab.devops/component: kca
              app.kubernetes.io/managed-by: kyverno
          spec:
            podSelector: {}
            policyTypes: [Ingress]
