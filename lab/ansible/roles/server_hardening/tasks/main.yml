---
- name: Ensure SELinux mode
  ansible.posix.selinux:
    policy: targeted
    state: "{{ hardening_selinux_state }}"

- name: Login banner
  ansible.builtin.copy:
    dest: /etc/issue.net
    content: "{{ hardening_banner }}\n"
    mode: "0644"

- name: sshd drop-in config
  ansible.builtin.template:
    src: 50-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/50-hardening.conf
    mode: "0600"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: Kernel parameters
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    sysctl_file: /etc/sysctl.d/90-hardening.conf
    reload: true
  loop: "{{ hardening_sysctl | dict2items }}"

- name: Allowed firewalld services
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ hardening_allowed_services }}"

- name: Remove legacy packages
  ansible.builtin.dnf:
    name: [telnet-server, rsh-server, tftp-server]
    state: absent
