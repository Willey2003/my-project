---
# Week 15: Ansible Vault.
#   ansible-vault create secrets.yml      (put: db_password: S3cret!)
#   ansible-playbook playbooks/03-vault-secrets.yml --ask-vault-pass
- name: Use a vaulted secret without leaking it
  hosts: db
  vars_files:
    - ../secrets.yml
  tasks:
    - name: Write the secret to a root-only file
      ansible.builtin.copy:
        dest: /etc/app.secret
        content: "{{ db_password }}\n"
        owner: root
        mode: "0600"
      no_log: true
