# Weeks 18-20: 3-tier stack. docker compose up -d --build ; curl localhost:8080
# Two networks: 'front' (web<->api) and 'back' (api<->db, internal: no internet, web can't reach db).
name: lab3tier
services:
  web:
    image: nginxinc/nginx-unprivileged:stable-alpine
    ports: ["8080:8080"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api: { condition: service_healthy }
    networks: [front]
    read_only: true
    tmpfs: [/tmp]

  api:
    build: { context: ./app, target: runtime }
    image: lab-api:local
    environment:
      DATABASE_URL: postgresql://app:${DB_PASSWORD:-changeme}@db:5432/app
      APP_VERSION: compose
    depends_on:
      db: { condition: service_healthy }
    networks: [front, back]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: app
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      retries: 10
    networks: [back]

networks:
  front: {}
  back: { internal: true }

volumes:
  dbdata: {}
