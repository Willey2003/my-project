# Week 53: app-of-apps. Push this 'gitops' folder to your GitHub repo, set REPO_URL below, then:
#   kubectl apply -n argocd -f root-app.yaml
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root
  namespace: argocd
  finalizers: [resources-finalizer.argocd.argoproj.io]
spec:
  project: default
  source:
    repoURL: https://github.com/Willey2003/my-project.git   # REPO_URL - change to your repo
    targetRevision: main
    path: lab/gitops/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
