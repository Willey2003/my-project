apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop
  namespace: argocd
spec:
  project: lab
  source:
    repoURL: https://github.com/Willey2003/my-project.git
    targetRevision: main
    path: lab/k8s/manifests
    directory:
      include: "app.yaml"
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
