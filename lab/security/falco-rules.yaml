# Week 31/49: custom Falco rules, mapped to MITRE ATT&CK. Loaded by ./lab.sh addon falco.
# Test: kubectl exec -it <any pod> -- sh     then: kubectl -n falco logs -l app.kubernetes.io/name=falco | grep LAB
- list: lab_shells
  items: [sh, bash, ash, zsh, dash]

- rule: LAB Shell spawned in container
  desc: Interactive shell inside a container (T1059 Command and Scripting Interpreter)
  condition: >
    spawned_process and container and proc.name in (lab_shells) and proc.tty != 0
  output: >
    LAB shell in container (user=%user.name container=%container.name image=%container.image.repository
    pod=%k8s.pod.name ns=%k8s.ns.name cmd=%proc.cmdline)
  priority: WARNING
  tags: [lab, mitre_execution, T1059]

- rule: LAB Read of ServiceAccount token
  desc: Process other than the app reading the mounted SA token (T1528 Steal Application Access Token)
  condition: >
    open_read and container and fd.name startswith /var/run/secrets/kubernetes.io/serviceaccount/token
    and not proc.name in (kubelet, coredns, cilium-agent)
  output: LAB SA token read (proc=%proc.name file=%fd.name pod=%k8s.pod.name ns=%k8s.ns.name)
  priority: NOTICE
  tags: [lab, mitre_credential_access, T1528]

- rule: LAB Package manager in running container
  desc: Containers should be immutable; installing packages at runtime is suspicious
  condition: spawned_process and container and proc.name in (apk, apt, apt-get, dnf, yum, pip, pip3)
  output: LAB package manager run (cmd=%proc.cmdline pod=%k8s.pod.name image=%container.image.repository)
  priority: ERROR
  tags: [lab, mitre_persistence]
