# Week 30 (CKAD): init container, sidecar (native: restartPolicy Always), Job, CronJob.
apiVersion: v1
kind: Namespace
metadata:
  name: ckad-patterns
  labels:
    lab.devops/component: ckad
---
apiVersion: v1
kind: Pod
metadata:
  name: patterns
  namespace: ckad-patterns
  labels: { app: patterns }
spec:
  initContainers:
    - name: wait-for-dns
      image: busybox:1.36
      command: ["sh", "-c", "until nslookup kubernetes.default.svc.cluster.local; do sleep 2; done"]
    - name: log-shipper          # native sidecar: starts before, stops after the main container
      image: busybox:1.36
      restartPolicy: Always
      command: ["sh", "-c", "tail -F /var/log/app/app.log"]
      volumeMounts: [{ name: logs, mountPath: /var/log/app }]
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /var/log/app/app.log; sleep 5; done"]
      volumeMounts: [{ name: logs, mountPath: /var/log/app }]
  volumes:
    - name: logs
      emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata: { name: pi, namespace: ckad-patterns }
spec:
  completions: 3
  parallelism: 2
  backoffLimit: 2
  activeDeadlineSeconds: 120
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: pi
          image: perl:5.40-slim
          command: ["perl", "-Mbignum=bpi", "-wle", "print bpi(200)"]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: report, namespace: ckad-patterns }
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: report
              image: busybox:1.36
              command: ["sh", "-c", "echo report at $(date)"]
