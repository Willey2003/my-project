# Week 28: StorageClass / PVC / StatefulSet with kind's built-in local-path provisioner ("standard").
apiVersion: v1
kind: Namespace
metadata:
  name: cka-storage
  labels:
    lab.devops/component: cka
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: data, namespace: cka-storage }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: standard
  resources: { requests: { storage: 1Gi } }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: web, namespace: cka-storage }
spec:
  serviceName: web
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: nginx
          image: nginx:stable-alpine
          volumeMounts: [{ name: www, mountPath: /usr/share/nginx/html }]
  volumeClaimTemplates:
    - metadata: { name: www }
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: standard
        resources: { requests: { storage: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: web, namespace: cka-storage }
spec:
  clusterIP: None
  selector: { app: web }
  ports: [{ port: 80 }]
