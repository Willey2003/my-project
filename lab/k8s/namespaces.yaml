# One namespace per lab component. Every manifest in this repo also creates/targets its own namespace,
# so this file is optional: apply it to pre-create them all (kubectl apply -f k8s/namespaces.yaml)
# and clean up a component with one command (kubectl delete ns <name>).
# Tool namespaces (ingress-nginx, argocd, falco, istio-system, monitoring ...) are created by k8s/addons/install.sh.
apiVersion: v1
kind: Namespace
metadata:
  name: shop
  labels: { lab.devops/component: kcna-cka-ckad, pod-security.kubernetes.io/enforce: restricted }
---
apiVersion: v1
kind: Namespace
metadata:
  name: ckad-patterns
  labels: { lab.devops/component: ckad }
---
apiVersion: v1
kind: Namespace
metadata:
  name: cka-storage
  labels: { lab.devops/component: cka }
---
apiVersion: v1
kind: Namespace
metadata:
  name: trouble
  labels: { lab.devops/component: cka-troubleshooting }
---
apiVersion: v1
kind: Namespace
metadata:
  name: cks-bench
  labels: { lab.devops/component: cks }
---
apiVersion: v1
kind: Namespace
metadata:
  name: cks-runtime
  labels: { lab.devops/component: cks }
---
apiVersion: v1
kind: Namespace
metadata:
  name: secure
  labels: { lab.devops/component: cks-supply-chain, policy.sigstore.dev/include: "true" }
---
apiVersion: v1
kind: Namespace
metadata:
  name: psa-restricted
  labels: { lab.devops/component: kcsa-cks, pod-security.kubernetes.io/enforce: restricted, pod-security.kubernetes.io/warn: restricted }
---
apiVersion: v1
kind: Namespace
metadata:
  name: psa-baseline
  labels: { lab.devops/component: kcsa-cks, pod-security.kubernetes.io/enforce: baseline, pod-security.kubernetes.io/warn: restricted }
---
apiVersion: v1
kind: Namespace
metadata:
  name: rollouts-demo
  labels: { lab.devops/component: capa }
---
apiVersion: v1
kind: Namespace
metadata:
  name: mesh-bookinfo
  labels: { lab.devops/component: ica, istio-injection: enabled }
